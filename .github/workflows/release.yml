# Release pipeline. Triggered by pushing a tag `vX.Y.Z` that matches pyproject's version.
#
# 1. test          — the ci matrix, again, on the tagged commit
# 2. build         — sdist + wheel
# 3. mcpb          — one .mcpb for every platform: the manifest declares
#                    server.type "uv" and the bundle carries sources and a
#                    uv.lock, nothing compiled
# 4. bundle-check  — the built bundle must answer initialize on each OS, on a
#                    cold cache, and under interpreters other than its pin.
#                    This is the gate that would have caught the cp312 bundles.
# 5. release       — GitHub release with wheel, sdist and the bundle attached.
#                    Creating the release is what fires the Zenodo webhook and
#                    mints the DOI. GitHub releases are the distribution channel;
#                    nothing is published to a package index.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q tests
      - run: python tests/smoke_stdio.py
      - run: python mcpb/build.py --check-identity

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag must match pyproject version
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          sys.exit(0 if v == tag else f"pyproject says {v}, tag says {tag}")
          EOF
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  mcpb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python mcpb/build.py
      - name: Validate manifest with the mcpb CLI
        run: npx --yes @anthropic-ai/mcpb validate build/bundle/manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: dist/*.mcpb

  bundle-check:
    needs: mcpb
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/download-artifact@v8
        with:
          name: mcpb
          path: dist/
      - name: Cold cache, the bundle's own pin
        shell: bash
        run: python tests/bundle_handshake.py dist/*.mcpb --cold
      - name: Interpreters other than the pin
        shell: bash
        run: |
          python tests/bundle_handshake.py dist/*.mcpb --python 3.10
          python tests/bundle_handshake.py dist/*.mcpb --python 3.12

  release:
    needs: [build, bundle-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artefacts/
      - name: Release notes from CHANGELOG
        run: python mcpb/build.py --release-notes "${{ github.ref_name }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            artefacts/dist/*
            artefacts/mcpb/*.mcpb
