# Release pipeline. Triggered by pushing a tag `vX.Y.Z` that matches pyproject's version.
#
# 1. test        — the ci matrix, again, on the tagged commit
# 2. build       — sdist + wheel
# 3. mcpb        — one .mcpb per platform (pydantic-core is a native wheel, so
#                  the bundle is built on the OS it targets)
# 4. release     — GitHub release with wheel, sdist and the bundles attached.
#                  Creating the release is what fires the Zenodo webhook and
#                  mints the DOI. GitHub releases are the distribution channel;
#                  nothing is published to a package index.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q tests
      - run: python tests/smoke_stdio.py
      - run: python mcpb/build.py --check-identity

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match pyproject version
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          sys.exit(0 if v == tag else f"pyproject says {v}, tag says {tag}")
          EOF
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  mcpb:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: macos-latest
            platform: darwin-arm64
          # No darwin-x64 bundle: GitHub retired its Intel macOS runners, and
          # a job on a retired label queues forever and blocks the release.
          # Intel Macs install with pip from the release tag instead.
          - os: ubuntu-latest
            platform: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: python mcpb/build.py --platform ${{ matrix.platform }}
      - name: Validate manifest with the mcpb CLI
        run: npx --yes @anthropic-ai/mcpb validate build/${{ matrix.platform }}/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-${{ matrix.platform }}
          path: dist/*.mcpb

  release:
    needs: [build, mcpb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts/
      - name: Release notes from CHANGELOG
        run: python mcpb/build.py --release-notes "${{ github.ref_name }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            artefacts/dist/*
            artefacts/mcpb-*/*.mcpb
