name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.12 is the version the earlier bundles shipped and was never tested
        # here. 3.14 is tested because the reported pydantic fault on 3.14 was
        # traced to pre-release interpreter builds; this matrix is where that
        # claim is kept honest.
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q tests
      - run: python tests/smoke_stdio.py
      - name: Vendored files are byte-identical to the family reference
        run: python mcpb/build.py --check-identity

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python mcpb/build.py
      - run: npx --yes @anthropic-ai/mcpb validate build/bundle/manifest.json
      - name: The built bundle answers initialize on a cold cache
        run: python tests/bundle_handshake.py dist/*.mcpb --cold
