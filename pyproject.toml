[project]
name = "cinii-mcp"
version = "2.3.0"
description = "MCP stdio server for the CiNii Research API (Japanese scholarship)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Christopher Gerteis", email = "christopher.gerteis@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "cinii",
    "nii",
    "japanese-studies",
    "east-asian-studies",
    "digital-humanities",
    "bibliographic-search",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://www.christophergerteis.net"
Repository = "https://github.com/ckgerteis/cinii-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The whole project is flat: server.py, mediation.py and ledger.py sit at the
# root. `packages = ["."]` with an `include` list does NOT constrain the wheel —
# `include` filters within the selected root rather than replacing it — so it
# shipped the entire directory into site-packages. `only-include` selects.
#
# ledger.py MUST be listed. Omitting it does not fail the build: mediation.py
# catches the ImportError, sets _ledger = None, and every query goes unrecorded
# with no error to notice.
[tool.hatch.build.targets.wheel]
only-include = ["server.py", "mediation.py", "ledger.py"]
